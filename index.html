<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Currículo PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="icon.png">

<script src="libs/jspdf.umd.min.js"></script>
<script src="libs/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
    /* --- ESTILOS DO SISTEMA --- */
    :root { --primary: #2563eb; --secondary: #1e40af; --bg-app: #f8f9fa; --bg-panel: #ffffff; --bg-preview: #525659; --text: #1f2937; --border: #e5e7eb; --input-bg: #f9fafb; }
    * { box-sizing: border-box; outline: none; }
    body { margin: 0; padding: 0; background: var(--bg-app); font-family: 'Roboto', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    
    .app-container { display: flex; width: 100vw; height: 100vh; }
    
    /* PAINEL ESQUERDO (EDITOR) */
    .editor-panel { width: 450px; min-width: 350px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; overflow-y: auto; z-index: 10; padding-bottom: 20px; }
    .editor-content { padding: 30px; padding-bottom: 60px; }
    
    .header-branding { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--primary); }
    .header-branding h1 { margin: 0; font-size: 20px; color: var(--primary); font-weight: 700; }
    .header-branding span { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }

    /* FORMULÁRIO */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #374151; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: #111; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
    textarea { resize: vertical; min-height: 80px; }

    /* BOTÕES */
    .btn-group { display: flex; gap: 10px; margin-top: 25px; flex-direction: column; }
    button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-whatsapp { background: #25D366; color: white; }

    /* ÁREA DE CRÉDITOS (IMPORTANTE: CLICÁVEL) */
    .credit-badge { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 700; color: #1e40af; font-size: 14px; cursor: pointer; user-select: none; transition: 0.2s; }
    .credit-badge:active { transform: scale(0.98); background: #dbeafe; }

    /* RODAPÉ */
    .footer-signature { margin-top: auto; padding: 20px; text-align: center; font-size: 11px; color: #9ca3af; font-family: monospace; border-top: 1px solid #f3f4f6; }

    /* PAINEL DIREITO (PREVIEW) */
    .preview-panel { flex: 1; background: var(--bg-preview); display: flex; justify-content: center; align-items: flex-start; padding: 40px; overflow: auto; }
    .paper-container { transform-origin: top center; transition: transform 0.3s ease; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    #cv-paper { width: 210mm; min-height: 297mm; background: white; overflow: hidden; position: relative; }

    /* --- RESPONSIVIDADE (MOBILE FIX) --- */
    @media (min-width: 901px) {
        @media (max-width: 1600px) { .paper-container { transform: scale(0.85); margin-bottom: -15%; } }
        @media (max-width: 1366px) { .paper-container { transform: scale(0.75); margin-bottom: -25%; } }
    }
    @media (max-width: 900px) {
        body { overflow: auto; height: auto; }
        .app-container { flex-direction: column; width: 100%; height: auto; }
        .editor-panel { width: 100%; height: auto; border-right: none; overflow: visible; }
        .preview-panel { display: flex; height: auto; padding: 10px; background: #525659; min-height: 600px; overflow: hidden; }
        .paper-container { transform: scale(0.44); transform-origin: top center; margin-top: 10px; margin-bottom: -150px; }
        .btn-group { padding-bottom: 30px; }
    }

    /* LAYOUTS DO CURRÍCULO */
    .layout-modern { display: grid; grid-template-columns: 32% 68%; height: 100%; min-height: 297mm; }
    .layout-modern .sidebar { background: #2d3748; color: white; padding: 30px 20px; }
    .layout-modern .main { padding: 40px 30px; color: #333; }
    .layout-modern img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin: 0 auto 25px auto; display: block; border: 4px solid rgba(255,255,255,0.2); }
    .layout-modern h2 { margin: 0; font-size: 32px; color: #1a202c; text-transform: uppercase; font-weight: 800; line-height: 1; }
    .layout-modern .role-title { font-size: 14px; color: #2563eb; font-weight: 700; text-transform: uppercase; margin: 5px 0 30px 0; }
    .layout-modern h3 { font-size: 14px; border-bottom: 2px solid #e2e8f0; margin: 30px 0 12px 0; text-transform: uppercase; color: #4a5568; }
    .layout-modern .sidebar h3 { border-bottom: 1px solid #4a5568; color: #a0aec0; }
    .layout-modern p { font-size: 13px; line-height: 1.6; color: #4a5568; margin-bottom: 15px; }
    .layout-modern .sidebar p { color: #cbd5e0; }

    .layout-classic { padding: 50px; color: #000; }
    .layout-classic .header { text-align: center; border-bottom: 1px solid #000; padding-bottom: 25px; margin-bottom: 30px; }
    .layout-classic h2 { font-size: 36px; margin: 0; text-transform: uppercase; }
    .layout-classic h3 { background: #f3f4f6; padding: 6px 10px; font-size: 16px; margin-top: 30px; text-transform: uppercase; border-left: 5px solid #333; font-weight: 700; }

    .layout-executive { padding: 50px; }
    .layout-executive .header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #1e40af; padding-bottom: 25px; margin-bottom: 30px; }
    .layout-executive h2 { font-size: 38px; color: #1e40af; margin: 0; line-height: 1; }
    .layout-executive h3 { color: #1e40af; font-size: 18px; margin-top: 30px; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
</style>
</head>
<body>

<div class="app-container" id="app">
    <div class="editor-panel">
        <div class="editor-content">
            <div class="header-branding"><h1>CV BUILDER PRO</h1><span>Enterprise Edition</span></div>
            
            <div class="credit-badge" id="creditDisplay" onclick="adminUnlock()">Carregando licença...</div>

            <div class="form-group"><label>🎨 Layout</label><select id="layoutSelector" onchange="updatePreview()"><option value="modern">Moderno</option><option value="classic">Clássico</option><option value="executive">Executivo</option></select></div>
            <div class="form-group"><label>🤖 Auto-Preencher</label><select id="jobSelector" onchange="autoFillJob()"><option value="">Selecione a profissão...</option><option value="mecanico">Mecânico</option><option value="vendedor">Vendedor</option><option value="admin">Administrativo</option><option value="ti">Técnico TI</option><option value="saude">Saúde</option></select></div>
            
            <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
            
            <div class="form-group"><label>📸 Foto</label><input type="file" id="foto" accept="image/*"></div>
            <div class="form-group"><label>Nome</label><input id="nome" placeholder="Nome Completo" oninput="updatePreview()"></div>
            <div class="form-group"><label>Telefone</label><input id="telefone" placeholder="(DD) 90000-0000" oninput="updatePreview()"></div>
            <div class="form-group"><label>Email</label><input id="email" placeholder="email@exemplo.com" oninput="updatePreview()"></div>
            <div class="form-group"><label>Cidade</label><input id="local" placeholder="Cidade - UF" oninput="updatePreview()"></div>
            <div class="form-group"><label>Cargo</label><input id="cargo" placeholder="Ex: Motorista" oninput="updatePreview()"></div>
            <div class="form-group"><label>Resumo</label><textarea id="resumo" oninput="updatePreview()"></textarea></div>
            <div class="form-group"><label>Experiência</label><textarea id="exp" rows="6" oninput="updatePreview()"></textarea></div>
            <div class="form-group"><label>Formação</label><textarea id="formacao" oninput="updatePreview()"></textarea></div>
            <div class="form-group"><label>Habilidades</label><textarea id="skills" oninput="updatePreview()"></textarea></div>

            <div class="btn-group">
                <button class="btn-whatsapp" onclick="processAction('whatsapp')">📱 Enviar via WhatsApp</button>
                <button class="btn-primary" onclick="processAction('download')">💾 Baixar PDF</button>
            </div>
            
            <p style="text-align:center; font-size:10px; color:#ccc; margin-top:15px;">ID: <span id="licencaID">LOADING...</span></p>
        </div>
        <div class="footer-signature">Desenvolvido com 🤖 por thIAguinho Soluções</div>
    </div>
    <div class="preview-panel">
        <div class="paper-container"><div id="cv-paper" class="layout-modern"></div></div>
    </div>
</div>

<script>
    // 1. REGISTRA O SERVICE WORKER (OFFLINE)
    if ('serviceWorker' in navigator) { 
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js')); 
    }

    // 2. SISTEMA DE CRÉDITOS OFUSCADO
    const KEY_CREDITS = "_sys_config_x99"; // Nome difícil pra usuário não achar fácil
    const KEY_ID = "_sys_id_user";
    const CREDITS_INITIAL = 3; 

    let userCredits = parseInt(localStorage.getItem(KEY_CREDITS));
    if (isNaN(userCredits)) { userCredits = CREDITS_INITIAL; localStorage.setItem(KEY_CREDITS, userCredits); }
    
    let userID = localStorage.getItem(KEY_ID);
    if(!userID) { userID = "USR-" + Math.floor(Math.random() * 999999); localStorage.setItem(KEY_ID, userID); }
    document.getElementById("licencaID").innerText = userID;

    // 3. BACKDOOR (O SEGREDO DA SENHA)
    let tapCount = 0;
    function adminUnlock() {
        tapCount++;
        if (tapCount === 5) {
            const pwd = prompt("🔐 SUPORTE TÉCNICO\nInsira o código de liberação:");
            if (pwd === "admin123") { // <--- SUA SENHA AQUI
                localStorage.setItem(KEY_CREDITS, 50);
                alert("✅ PACOTE LIBERADO!\nVocê agora tem 50 créditos.");
                location.reload();
            } else if (pwd !== null) {
                alert("❌ Código inválido.");
            }
            tapCount = 0;
        }
        setTimeout(() => { tapCount = 0; }, 2000); // Reseta se demorar
    }

    // 4. ATUALIZA A TELA DE CRÉDITOS
    function updateCreditsUI() {
        const el = document.getElementById("creditDisplay");
        if(userCredits > 0) {
            el.innerHTML = `CRÉDITOS RESTANTES: ${userCredits}`;
            el.style.background = "#eff6ff"; el.style.color = "#1e40af";
        } else {
            el.innerHTML = `LIMITE ATINGIDO<br><span style="font-size:10px">(Toque para liberar com código)</span>`;
            el.style.background = "#fef2f2"; el.style.color = "#991b1b";
        }
    }
    updateCreditsUI();

    // 5. INTELIGÊNCIA DE PREENCHIMENTO
    const JOB_DATA = {
        "mecanico": { resumo: "Experiência em manutenção preventiva e corretiva.", skills: "• Injeção Eletrônica\n• Freios\n• Câmbio", exp: "Oficina X (2020-Atual)\nMecânico Geral." },
        "vendedor": { resumo: "Focado em metas e atendimento ao cliente.", skills: "• Negociação\n• CRM\n• Vendas", exp: "Loja Y (2021-Atual)\nVendedor Sênior." },
        "admin": { resumo: "Organizado, domínio de rotinas administrativas.", skills: "• Excel\n• NFe\n• Finanças", exp: "Escritório Z (2022-Atual)\nAuxiliar Adm." },
        "ti": { resumo: "Suporte técnico e manutenção de computadores.", skills: "• Hardware\n• Windows\n• Redes", exp: "Tech Info (2021-Atual)\nSuporte N1." },
        "saude": { resumo: "Atendimento humanizado e cuidados de enfermagem.", skills: "• Primeiros Socorros\n• Triagem", exp: "Hospital W (2019-Atual)\nTécnico." }
    };

    let fotoData = "";
    document.getElementById("foto").addEventListener("change", e => { if(e.target.files[0]){ const r = new FileReader(); r.onload = ev => { fotoData = ev.target.result; updatePreview(); }; r.readAsDataURL(e.target.files[0]); } });

    function autoFillJob() {
        const j = document.getElementById("jobSelector").value;
        if(JOB_DATA[j]) { document.getElementById("resumo").value = JOB_DATA[j].resumo; document.getElementById("skills").value = JOB_DATA[j].skills; document.getElementById("exp").value = JOB_DATA[j].exp; updatePreview(); }
    }

    // 6. RENDERIZADOR (VIEW)
    function updatePreview() {
        const d = { 
            nome: document.getElementById("nome").value || "Seu Nome", 
            telefone: document.getElementById("telefone").value || "(00) 00000-0000", 
            email: document.getElementById("email").value || "email@exemplo.com", 
            local: document.getElementById("local").value || "Cidade - UF", 
            cargo: document.getElementById("cargo").value || "Cargo", 
            resumo: document.getElementById("resumo").value, 
            exp: document.getElementById("exp").value, 
            formacao: document.getElementById("formacao").value, 
            skills: document.getElementById("skills").value, 
            layout: document.getElementById("layoutSelector").value 
        };
        
        const p = document.getElementById("cv-paper"); 
        p.className = ""; p.classList.add(`layout-${d.layout}`);
        const fmt = t => t ? t.replace(/\n/g, '<br>') : '';
        
        let h = "";
        if (d.layout === 'modern') h = `<div class="sidebar">${fotoData ? `<img src="${fotoData}">` : ''}<h3>Contato</h3><div class="contact-item">📞 ${d.telefone}</div><div class="contact-item">📧 ${d.email}</div><div class="contact-item">📍 ${d.local}</div><h3>Competências</h3><p>${fmt(d.skills)}</p></div><div class="main"><h2>${d.nome}</h2><div class="role-title">${d.cargo}</div><h3>Resumo</h3><p>${fmt(d.resumo)}</p><h3>Experiência</h3><p>${fmt(d.exp)}</p><h3>Formação</h3><p>${fmt(d.formacao)}</p></div>`;
        else if (d.layout === 'classic') h = `<div class="header"><h2>${d.nome}</h2><div class="sub-header">${d.telefone} • ${d.email} • ${d.local}</div><div class="sub-header" style="font-weight:bold; margin-top:10px;">${d.cargo}</div></div>${d.resumo ? `<h3>Resumo</h3><p>${fmt(d.resumo)}</p>` : ''}${d.exp ? `<h3>Experiência</h3><p>${fmt(d.exp)}</p>` : ''}${d.formacao ? `<h3>Formação</h3><p>${fmt(d.formacao)}</p>` : ''}${d.skills ? `<h3>Habilidades</h3><p>${fmt(d.skills)}</p>` : ''}`;
        else h = `<div class="header"><div class="header-text"><h2>${d.nome}</h2><div class="role-text">${d.cargo}</div><div class="contact-line">${d.telefone} | ${d.email} | ${d.local}</div></div>${fotoData ? `<img src="${fotoData}">` : ''}</div><h3>Perfil</h3><p>${fmt(d.resumo)}</p><h3>Trajetória</h3><p>${fmt(d.exp)}</p><h3>Educação</h3><p>${fmt(d.formacao)}</p><h3>Skills</h3><p>${fmt(d.skills)}</p>`;
        
        p.innerHTML = h;
    }
    updatePreview();

    // 7. MOTOR DE PDF (COM CORREÇÃO PARA CELULAR E SHARE API)
    async function processAction(actionType) {
        if (userCredits <= 0) { alert("⚠️ SEU PLANO ACABOU.\nToque 5 vezes na mensagem 'LIMITE ATINGIDO' para inserir o código de recarga."); return; }

        const btn = actionType === 'whatsapp' ? document.querySelector('.btn-whatsapp') : document.querySelector('.btn-primary');
        const oldTxt = btn.innerHTML;
        btn.innerHTML = "⏳ Processando..."; btn.disabled = true;

        try {
            // A. CLONAGEM SILENCIOSA (FIX TEXTO SOBRESCRITO)
            const original = document.getElementById('cv-paper'); 
            const clone = original.cloneNode(true);
            
            // Configura o clone para ser um A4 perfeito, invisível
            clone.style.transform = "none"; 
            clone.style.position = "fixed"; 
            clone.style.top = "-9999px"; 
            clone.style.left = "0"; 
            clone.style.width = "210mm"; 
            clone.style.minHeight = "297mm"; 
            clone.style.zIndex = "-1"; 
            clone.style.margin = "0"; 
            document.body.appendChild(clone);

            // B. GERA A IMAGEM
            const canvas = await html2canvas(clone, { scale: 2, useCORS: true, logging: false, windowWidth: 1200 });
            document.body.removeChild(clone); // Limpa memória

            // C. GERA O PDF
            const { jsPDF } = window.jspdf; 
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = pdf.internal.pageSize.getHeight();
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfW, pdfH);

            const safeName = document.getElementById('nome').value.replace(/[^a-z0-9]/gi, '_') || "curriculo";
            const fileName = `Curriculo_${safeName}.pdf`;

            // D. DECISÃO: WHATSAPP (SHARE) OU DOWNLOAD
            if (actionType === 'whatsapp' && navigator.share) {
                // Tenta compartilhar direto (Anexo Nativo)
                const blob = pdf.output('blob');
                const file = new File([blob], fileName, { type: "application/pdf" });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Meu Currículo',
                        text: 'Segue meu currículo em PDF.'
                    });
                    // Sucesso = Desconta crédito
                    userCredits--; localStorage.setItem(KEY_CREDITS, userCredits); updateCreditsUI();
                } else {
                    throw new Error("Compartilhamento direto não suportado");
                }
            } else {
                // Fallback: Baixa o arquivo
                pdf.save(fileName);
                userCredits--; localStorage.setItem(KEY_CREDITS, userCredits); updateCreditsUI();
                if (actionType === 'whatsapp') alert("⚠️ O arquivo foi baixado!\nAgora abra o WhatsApp e anexe o PDF da pasta 'Downloads'.");
            }

        } catch (e) {
            console.error(e);
            // Se der erro no share, força o download
            if (actionType === 'whatsapp') alert("⚠️ Não foi possível abrir o WhatsApp direto.\nO arquivo será baixado no seu celular.");
        }

        btn.innerHTML = oldTxt; btn.disabled = false;
    }
</script>
</body>
</html>
