<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerador de Currículo PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="icon.png">

<script src="libs/jspdf.umd.min.js"></script>
<script src="libs/html2canvas.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
    /* --- CSS SYSTEM --- */
    :root { 
        --primary: #2563eb; 
        --secondary: #1e40af; 
        --bg-app: #f0f2f5; 
        --bg-panel: #ffffff; 
        --text: #1f2937; 
        --border: #e5e7eb; 
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body { 
        margin: 0; 
        padding: 0; 
        background: var(--bg-app); 
        font-family: 'Roboto', sans-serif; 
        color: var(--text); 
        height: 100vh; 
        overflow: hidden; 
        display: flex;
        flex-direction: column;
    }

    /* --- LAYOUT RESPONSIVO (MOBILE FIRST) --- */
    .app-container { 
        display: flex; 
        flex: 1;
        width: 100%; 
        height: 100%; 
        overflow: hidden;
    }

    /* EDITOR (Esquerda/Topo) */
    .editor-panel { 
        width: 100%;
        height: 100%;
        background: var(--bg-panel); 
        display: flex; 
        flex-direction: column; 
        overflow-y: auto; 
        padding: 20px;
        z-index: 10;
    }

    /* PREVIEW (Direita/Oculto no Mobile) */
    .preview-panel { 
        display: none; /* Escondido no celular para economizar memória visual */
        flex: 1; 
        background: #525659; 
        justify-content: center; 
        align-items: flex-start; 
        padding: 40px; 
        overflow-y: auto; 
    }

    /* QUANDO EM DESKTOP/TABLET */
    @media (min-width: 900px) {
        .editor-panel { width: 400px; border-right: 1px solid var(--border); }
        .preview-panel { display: flex; }
    }

    /* --- ELEMENTOS DE UI --- */
    .header-branding { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary); }
    .header-branding h1 { margin: 0; font-size: 20px; color: var(--primary); font-weight: 700; }
    .header-branding span { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

    .credit-badge { 
        background: #eff6ff; 
        border: 1px solid #bfdbfe; 
        color: #1e40af; 
        padding: 12px; 
        border-radius: 8px; 
        margin-bottom: 20px; 
        text-align: center; 
        font-weight: 700; 
        font-size: 14px; 
        cursor: pointer; 
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; text-transform: uppercase; }
    
    input, select, textarea { 
        width: 100%; 
        padding: 12px; 
        background: #f9fafb; 
        border: 1px solid var(--border); 
        border-radius: 6px; 
        font-size: 14px; 
        color: #000;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }
    textarea { resize: vertical; min-height: 80px; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-direction: column; padding-bottom: 40px; }
    
    button { 
        width: 100%; 
        padding: 16px; 
        border: none; 
        border-radius: 8px; 
        font-weight: 700; 
        font-size: 15px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 8px; 
        text-transform: uppercase; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-whatsapp { background: #25D366; color: white; }

    .footer-signature { text-align: center; margin-top: auto; padding: 20px; font-size: 10px; color: #aaa; font-family: monospace; }

    /* --- PAPEL DO CURRÍCULO (ESTILO A4 FIXO) --- */
    #cv-paper { 
        width: 210mm; 
        min-height: 297mm; 
        background: white; 
        position: relative; 
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        /* Importante: letter-spacing normal para evitar bugs no Android */
        letter-spacing: normal; 
    }

    /* --- LAYOUTS --- */
    /* Modern */
    .layout-modern { display: grid; grid-template-columns: 30% 70%; height: 100%; }
    .layout-modern .sidebar { background: #333; color: white; padding: 20px; }
    .layout-modern .main { padding: 30px; color: #333; }
    .layout-modern h2 { margin: 0; font-size: 28px; text-transform: uppercase; }
    .layout-modern h3 { font-size: 16px; border-bottom: 2px solid #ddd; margin: 20px 0 10px 0; text-transform: uppercase; }
    .layout-modern .sidebar h3 { border-color: #555; color: #ccc; }
    
    /* Classic */
    .layout-classic { padding: 40px; color: #000; }
    .layout-classic .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
    .layout-classic h2 { margin: 0; font-size: 32px; text-transform: uppercase; }
    .layout-classic h3 { background: #eee; padding: 5px; margin-top: 20px; text-transform: uppercase; border-left: 5px solid #000; }

    /* Executive */
    .layout-executive { padding: 40px; }
    .layout-executive .header { border-left: 5px solid #1e40af; padding-left: 20px; margin-bottom: 30px; }
    .layout-executive h2 { margin: 0; font-size: 34px; color: #1e40af; }
    .layout-executive h3 { color: #1e40af; border-bottom: 1px solid #ccc; margin-top: 25px; }

    /* Utilitários de Texto no CV */
    .cv-text { font-size: 13px; line-height: 1.5; white-space: pre-line; }
    .cv-img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin: 0 auto 15px auto; display: block; border: 3px solid #fff; }
</style>
</head>
<body>

<div class="app-container">
    <div class="editor-panel">
        <div class="header-branding">
            <h1>CV BUILDER PRO</h1>
            <span>Sistema Profissional</span>
        </div>

        <div class="credit-badge" id="creditDisplay" onclick="adminUnlock()">
            Verificando licença...
        </div>

        <div class="form-group">
            <label>Modelo do Documento</label>
            <select id="layoutSelector" onchange="updatePreview()">
                <option value="modern">Moderno (Com Foto)</option>
                <option value="classic">Clássico (Tradicional)</option>
                <option value="executive">Executivo (Corporativo)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Preenchimento Inteligente</label>
            <select id="jobSelector" onchange="autoFillJob()">
                <option value="">Selecione para preencher...</option>
                <option value="mecanico">Mecânico</option>
                <option value="vendedor">Vendedor</option>
                <option value="admin">Administrativo</option>
                <option value="ti">Técnico TI</option>
                <option value="saude">Saúde/Enfermagem</option>
            </select>
        </div>

        <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

        <div class="form-group"><label>Foto</label><input type="file" id="foto" accept="image/*"></div>
        <div class="form-group"><label>Nome Completo</label><input id="nome" placeholder="Seu Nome" oninput="updatePreview()"></div>
        <div class="form-group"><label>Telefone</label><input id="telefone" placeholder="(00) 00000-0000" oninput="updatePreview()"></div>
        <div class="form-group"><label>Email</label><input id="email" placeholder="email@exemplo.com" oninput="updatePreview()"></div>
        <div class="form-group"><label>Cidade/Estado</label><input id="local" placeholder="Cidade - UF" oninput="updatePreview()"></div>
        <div class="form-group"><label>Cargo Pretendido</label><input id="cargo" placeholder="Ex: Motorista" oninput="updatePreview()"></div>
        
        <div class="form-group"><label>Resumo Profissional</label><textarea id="resumo" oninput="updatePreview()"></textarea></div>
        <div class="form-group"><label>Experiência Profissional</label><textarea id="exp" rows="5" oninput="updatePreview()"></textarea></div>
        <div class="form-group"><label>Formação Acadêmica</label><textarea id="formacao" oninput="updatePreview()"></textarea></div>
        <div class="form-group"><label>Habilidades</label><textarea id="skills" oninput="updatePreview()"></textarea></div>

        <div class="btn-group">
            <button class="btn-whatsapp" onclick="generateAndShare('whatsapp')">📱 Enviar no WhatsApp (PDF)</button>
            <button class="btn-primary" onclick="generateAndShare('download')">💾 Baixar Arquivo</button>
        </div>

        <div class="footer-signature">Desenvolvido com 🤖 por thIAguinho Soluções</div>
    </div>

    <div class="preview-panel">
        <div class="paper-container">
            <div id="cv-paper" class="layout-modern"></div>
        </div>
    </div>
</div>

<script>
    // 1. SERVICE WORKER (OFFLINE)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js');
    }

    // 2. SISTEMA DE CRÉDITOS OFUSCADO
    const STORAGE_KEY = "_sys_cfg_v2"; 
    const INITIAL_CREDITS = 3;
    let credits = parseInt(localStorage.getItem(STORAGE_KEY));
    
    if (isNaN(credits)) { 
        credits = INITIAL_CREDITS; 
        localStorage.setItem(STORAGE_KEY, credits); 
    }

    function updateCreditsUI() {
        const el = document.getElementById("creditDisplay");
        if (credits > 0) {
            el.innerHTML = `CRÉDITOS DISPONÍVEIS: ${credits}`;
            el.style.backgroundColor = "#eff6ff";
            el.style.color = "#1e40af";
        } else {
            el.innerHTML = `LIMITE ATINGIDO<br><small>(Toque para liberar)</small>`;
            el.style.backgroundColor = "#fef2f2";
            el.style.color = "#991b1b";
        }
    }
    updateCreditsUI();

    // 3. BACKDOOR (Desbloqueio com senha)
    let taps = 0;
    function adminUnlock() {
        taps++;
        if (taps === 5) {
            const pass = prompt("🔐 ÁREA ADMINISTRATIVA\nDigite o código de recarga:");
            if (pass === "admin123") {
                localStorage.setItem(STORAGE_KEY, 50);
                alert("✅ 50 CRÉDITOS ADICIONADOS!");
                location.reload();
            } else if (pass !== null) {
                alert("❌ Código incorreto.");
            }
            taps = 0;
        }
        setTimeout(() => taps = 0, 2000);
    }

    // 4. DADOS DE PREENCHIMENTO
    const JOBS = {
        "mecanico": { resumo: "Profissional com experiência em mecânica geral, diagnóstico e manutenção.", skills: "• Motor e Câmbio\n• Suspensão\n• Freios ABS", exp: "Oficina Central (2020-Atual)\nMecânico Líder." },
        "vendedor": { resumo: "Vendedor com foco em metas e satisfação do cliente.", skills: "• Atendimento\n• Negociação\n• CRM", exp: "Loja Varejo (2021-Atual)\nVendedor Sênior." },
        "admin": { resumo: "Experiência em rotinas administrativas e financeiras.", skills: "• Excel Avançado\n• Notas Fiscais\n• Atendimento", exp: "Escritório Contábil (2019-Atual)\nAuxiliar Adm." },
        "ti": { resumo: "Técnico de suporte focado em hardware e redes.", skills: "• Manutenção de PCs\n• Redes TCP/IP\n• Windows/Linux", exp: "Tech Info (2022-Atual)\nSuporte N1." },
        "saude": { resumo: "Profissional de saúde com atendimento humanizado.", skills: "• Primeiros Socorros\n• Triagem\n• Cuidados Gerais", exp: "Hospital Sta Casa (2020-Atual)\nTécnico de Enfermagem." }
    };

    let userPhoto = "";
    document.getElementById("foto").addEventListener("change", function(e) {
        if (e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                userPhoto = evt.target.result;
                updatePreview();
            };
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    function autoFillJob() {
        const job = document.getElementById("jobSelector").value;
        if (JOBS[job]) {
            document.getElementById("resumo").value = JOBS[job].resumo;
            document.getElementById("skills").value = JOBS[job].skills;
            document.getElementById("exp").value = JOBS[job].exp;
            updatePreview();
        }
    }

    // 5. RENDERIZAÇÃO DO HTML
    function updatePreview() {
        const d = {
            nome: document.getElementById("nome").value || "Nome Completo",
            telefone: document.getElementById("telefone").value || "(00) 00000-0000",
            email: document.getElementById("email").value || "email@exemplo.com",
            local: document.getElementById("local").value || "Cidade - UF",
            cargo: document.getElementById("cargo").value || "Cargo",
            resumo: document.getElementById("resumo").value,
            exp: document.getElementById("exp").value,
            formacao: document.getElementById("formacao").value,
            skills: document.getElementById("skills").value,
            layout: document.getElementById("layoutSelector").value
        };

        const paper = document.getElementById("cv-paper");
        paper.className = `layout-${d.layout}`;
        
        const safeText = (t) => t ? t.replace(/\n/g, "<br>") : "";
        let html = "";

        // Lógica simples de templates
        if (d.layout === 'modern') {
            html = `
                <div class="sidebar">
                    ${userPhoto ? `<img src="${userPhoto}" class="cv-img">` : ''}
                    <h3>Contato</h3>
                    <p class="cv-text">${d.telefone}<br>${d.email}<br>${d.local}</p>
                    <h3>Competências</h3>
                    <p class="cv-text">${safeText(d.skills)}</p>
                </div>
                <div class="main">
                    <h2>${d.nome}</h2>
                    <div style="color:#2563eb; font-weight:bold; margin-bottom:20px;">${d.cargo}</div>
                    <h3>Resumo</h3><p class="cv-text">${safeText(d.resumo)}</p>
                    <h3>Experiência</h3><p class="cv-text">${safeText(d.exp)}</p>
                    <h3>Formação</h3><p class="cv-text">${safeText(d.formacao)}</p>
                </div>`;
        } else if (d.layout === 'classic') {
            html = `
                <div class="header">
                    <h2>${d.nome}</h2>
                    <p>${d.telefone} | ${d.email} | ${d.local}</p>
                    <strong>${d.cargo}</strong>
                </div>
                ${d.resumo ? `<h3>Resumo</h3><p class="cv-text">${safeText(d.resumo)}</p>` : ''}
                ${d.exp ? `<h3>Experiência</h3><p class="cv-text">${safeText(d.exp)}</p>` : ''}
                ${d.formacao ? `<h3>Formação</h3><p class="cv-text">${safeText(d.formacao)}</p>` : ''}
                ${d.skills ? `<h3>Habilidades</h3><p class="cv-text">${safeText(d.skills)}</p>` : ''}`;
        } else {
            html = `
                <div class="header">
                    <div style="display:flex; justify-content:space-between;">
                        <div><h2>${d.nome}</h2><p style="color:#1e40af">${d.cargo}</p></div>
                        ${userPhoto ? `<img src="${userPhoto}" style="width:80px;height:80px;border-radius:5px;object-fit:cover;">` : ''}
                    </div>
                    <p style="font-size:12px; margin-top:5px;">${d.telefone} • ${d.email} • ${d.local}</p>
                </div>
                <h3>Perfil</h3><p class="cv-text">${safeText(d.resumo)}</p>
                <h3>Trajetória</h3><p class="cv-text">${safeText(d.exp)}</p>
                <h3>Educação</h3><p class="cv-text">${safeText(d.formacao)}</p>
                <h3>Skills</h3><p class="cv-text">${safeText(d.skills)}</p>`;
        }
        paper.innerHTML = html;
    }
    updatePreview();

    // 6. GERAÇÃO DE PDF BLINDADA (CLONAGEM + SHARE API)
    async function generateAndShare(mode) {
        if (credits <= 0) { 
            alert("⚠️ SEU PLANO ACABOU.\nToque 5 vezes no aviso 'LIMITE ATINGIDO' para recarregar."); 
            return; 
        }

        const btns = document.querySelectorAll("button");
        btns.forEach(b => { b.innerHTML = "⏳ Gerando..."; b.disabled = true; });

        try {
            // --- PASSO A: CLONAGEM PARA RESOLVER TEXTO SOBRESCRITO ---
            // Criamos uma cópia do currículo fora da tela, com tamanho A4 fixo (210mm)
            // Isso força o html2canvas a ignorar que estamos num celular pequeno.
            const original = document.getElementById("cv-paper");
            const clone = original.cloneNode(true);
            
            // Estilos forçados para o clone (Reset de CSS)
            clone.style.position = "fixed";
            clone.style.top = "-10000px";
            clone.style.left = "0";
            clone.style.width = "210mm";
            clone.style.minHeight = "297mm";
            clone.style.transform = "none";
            clone.style.margin = "0";
            clone.style.zIndex = "-1";
            
            document.body.appendChild(clone);

            // --- PASSO B: RENDERIZAÇÃO ---
            const canvas = await html2canvas(clone, {
                scale: 2, // Alta qualidade
                useCORS: true,
                logging: false,
                windowWidth: 1200 // Simula desktop para fontes não quebrarem
            });
            
            document.body.removeChild(clone); // Limpa a memória

            // --- PASSO C: CRIAÇÃO DO PDF ---
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(canvas.toDataURL("image/png"), 'PNG', 0, 0, pdfW, pdfH);
            
            const cleanName = document.getElementById("nome").value.replace(/[^a-z0-9]/gi, '_') || "Curriculo";
            const fileName = `Curriculo_${cleanName}.pdf`;

            // --- PASSO D: ESTRATÉGIA DE SALVAMENTO (SHARE FIRST) ---
            let success = false;

            // Tentativa 1: Web Share API (Nativo do Android - WhatsApp/Drive)
            if (navigator.share && navigator.canShare) {
                try {
                    const blob = pdf.output('blob');
                    const file = new File([blob], fileName, { type: "application/pdf" });
                    
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'Currículo Profissional',
                            text: 'Segue meu currículo em PDF.'
                        });
                        success = true;
                    }
                } catch (e) {
                    console.log("Share cancelado ou falhou: " + e);
                }
            }

            // Tentativa 2: Fallback direto (Se o Share falhar, tenta salvar)
            if (!success) {
                try {
                    pdf.save(fileName);
                    alert("✅ PDF Gerado!\n\nVerifique a pasta 'Downloads' ou 'Meus Arquivos' no seu celular.\n\nSe não encontrar, verifique as permissões do aplicativo.");
                    success = true;
                } catch (e) {
                    alert("❌ Erro de Permissão:\nO App não conseguiu salvar o arquivo.\n\nPor favor, habilite 'Permissão de Armazenamento' nas configurações do seu Android.");
                }
            }

            if (success) {
                credits--;
                localStorage.setItem(STORAGE_KEY, credits);
                updateCreditsUI();
            }

        } catch (e) {
            alert("Erro crítico: " + e.message);
        }

        // Restaura botões
        btns.forEach(b => b.disabled = false);
        document.querySelector(".btn-whatsapp").innerHTML = "📱 Enviar no WhatsApp (PDF)";
        document.querySelector(".btn-primary").innerHTML = "💾 Baixar Arquivo";
    }
</script>

</body>
</html>
